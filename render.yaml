services:
  - type: web
    name: lanart-realtime-phone-agent
    runtime: node
    region: ohio
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PHONE_AGENT_ALLOWED_FROM
        value: "+14387870109"
      - key: PHONE_AGENT_NUMBER
        value: "+14387938710"
      - key: PHONE_AGENT_MCP_SERVERS
        value: workspace-mcp,google-workspace-email,google-workspace,meta_ads_mcp,whatsapp,macos-contacts,quickbooks_lanart,shopify,shipstation,twilio-local
